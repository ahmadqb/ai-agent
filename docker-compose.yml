version: '3.8'

services:
  api:
    build: .
    container_name: manufacturing_api
    ports:
      - "8000:8000"
    volumes:
      - ./factory_data.db:/app/factory_data.db
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - agent_network

  agent:
    build: .
    container_name: manufacturing_agent
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    command: python agent.py
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent_network

networks:
  agent_network:
    driver: bridge